name: Profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/metrics.yml']

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          user: yijunjie07
          filename: github-metrics.svg
          template: classic
          base: header, repositories
          repositories_affiliations: owner
          repositories_forks: no
          config_timezone: Asia/Shanghai
          config_order: base.header, base.repositories, languages, isocalendar
          plugin_languages: yes
          plugin_languages_limit: 5
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugins_errors_fatal: yes
          retries: 1
